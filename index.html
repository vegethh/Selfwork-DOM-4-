<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork DOM 4 - Countdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Countdown Timer</h1>
    <label for="countdown-input">Inserisci i secondi:</label>
    <input type="text" id="countdown-input" placeholder="Inserisci i secondi:" min="1" max="10000">
    <p>Tempo rimanente: <span id="remainingTime">--</span></p>

    <button id="startBtn" class="btn btn-info">Avvia</button>
    <button id="stopBtn" class="btn btn-warning">Pausa</button>
    <button id="resetBtn" class="btn btn-success">Reset</button>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <script src="/main.js"></script>
</body>
</html>
